name: Build allowlist launcher

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launcher:
    name: Build com.ts.launcher APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Build allowlist launcher APK
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -PlauncherApplicationId=com.ts.launcher
      - name: Report APK size
        run: |
          apk=launcher/app/build/outputs/apk/release/app-release.apk
          echo "release APK: $(( $(stat -c %s "$apk") / 1024 )) KB"
      - uses: actions/upload-artifact@v4
        with:
          name: com-ts-launcher-apk
          path: launcher/app/build/outputs/apk/release/app-release.apk
